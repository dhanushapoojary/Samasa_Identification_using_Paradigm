<!doctype html>
<html lang="kn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ಕನ್ನಡ ಸಮಾಸ ಗುರುತಿಸುವಿಕೆ</title>
  <style>
    :root { color-scheme: light; --ink: #202b3c; --muted: #667085; --line: #e3e8ef; --paper: #ffffff; --wash: #f4f7fb; --accent: #2859a8; --accent-dark: #1d447f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(140deg, #eef4ff 0%, #f8fafc 48%, #f0f6f3 100%); color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans Kannada", "Noto Sans", sans-serif; }
    .wrap { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 54px 0 40px; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0 10px; font-size: clamp(30px, 5vw, 44px); line-height: 1.25; letter-spacing: -.03em; }
    .intro { max-width: 650px; color: var(--muted); line-height: 1.8; margin: 0 0 28px; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: clamp(20px, 4vw, 34px); box-shadow: 0 18px 50px rgba(25, 45, 80, .08); }
    label { display: block; font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .input-row { display: flex; gap: 10px; }
    input { flex: 1; min-width: 0; border: 1px solid #cbd5e1; border-radius: 12px; padding: 15px 16px; font: inherit; font-size: 20px; background: #fff; color: var(--ink); outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(40, 89, 168, .14); }
    button { border: 0; border-radius: 12px; padding: 0 22px; background: var(--accent); color: white; font: inherit; font-weight: 750; cursor: pointer; transition: background .15s ease, transform .15s ease; }
    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .result { margin-top: 24px; padding: 22px; border-radius: 16px; background: #f0f7f2; border: 1px solid #cfe5d5; }
    .result-label { color: #3d6b4c; font-size: 13px; font-weight: 800; letter-spacing: .06em; }
    .result h2 { margin: 8px 0 4px; font-size: clamp(25px, 4vw, 34px); }
    .detail { color: #496254; font-size: 14px; margin-top: 10px; overflow-wrap: anywhere; }
    .error { margin-top: 20px; padding: 16px 18px; border-radius: 12px; border: 1px solid #f0c7c7; background: #fff4f4; color: #8f2525; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .examples { margin-top: 24px; }
    .examples h3 { margin: 0 0 10px; font-size: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); background: var(--wash); color: #344054; border-radius: 999px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
    .chip:hover { border-color: #a9bad6; background: #edf3ff; }
    footer { margin-top: 24px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    @media (max-width: 560px) { .wrap { padding-top: 32px; } .input-row { flex-direction: column; } input, button { min-height: 52px; } button { padding: 13px 18px; } .panel { border-radius: 17px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <!-- <div class="eyebrow">Kannada Language Technology</div> -->
   <center> <h2>Kannada Samasa Identifier</h2></center>
    <!-- <p class="intro">ಕನ್ನಡ ಪದವನ್ನು ನಮೂದಿಸಿ. ಹಿನ್ನಲೆಯಲ್ಲಿ Samasa pipeline ಪದವನ್ನು ಪರಿಶೀಲಿಸಿ, ಗುರುತಿಸಿದ ಸಮಾಸದ ವಿಧವನ್ನು ಇಲ್ಲಿ ತೋರಿಸುತ್ತದೆ.</p> -->

    <section class="panel" aria-labelledby="input-heading">
      <form action="{{ url_for('identify') }}" method="post">
        <label id="input-heading" for="word">ಕನ್ನಡ ಪದ</label>
        <div class="input-row">
          <input id="word" name="word" type="text" value="{{ word }}" placeholder="Insert input word" autocomplete="off" required autofocus>
          <button type="submit">ಸಮಾಸ ಗುರುತಿಸಿ</button>
        </div>
        <!-- <p class="hint">ಒಂದು ಸಮಯದಲ್ಲಿ ಒಂದು ಪದವನ್ನು ಮಾತ್ರ ನಮೂದಿಸಿ.</p> -->
      </form>

      {% if result %}
      <section class="result" aria-live="polite">
        <div class="result-label">ಸಮಾಸ ವಿಧ</div>
        <h2>{{ result }}</h2>
        <!-- {% if detail %}<div class="detail">{{ detail }}</div>{% endif %} -->
      </section>
      {% endif %}

      {% if error %}
      <div class="error" role="alert">{{ error }}</div>
      {% endif %}

    </section>
    <!-- <footer>ಈ ಪುಟವು ನಿಮ್ಮ ಪ್ರಸ್ತುತ <code>samasa_pipeline_updated.py</code>, <code>word_split.py</code>, Morph Tool ಮತ್ತು <code>direct_karmadharaya_words.txt</code> ಫೈಲ್‌ಗಳನ್ನು ಬಳಸುತ್ತದೆ.</footer> -->
  </main>
  <script>
    function setWord(value) {
      const input = document.getElementById('word');
      input.value = value;
      input.focus();
    }
  </script>
</body>
</html>
